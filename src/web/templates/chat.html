<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ancient Court — Chat</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header>
    <h1>Ancient Court</h1>
    <p class="subtitle">Converse with history's great advisors</p>
  </header>

  <main class="chat-card">
    <div id="personas">
      <span class="section-label">Advisors</span>
      {% for persona in personas %}
        <button type="button" class="persona-chip" data-persona-id="{{ persona.persona_id }}" data-display-name="{{ persona.display_name }}">
          <span class="spinner" aria-hidden="true"></span>
          <span>{{ persona.display_name }} <small>— {{ persona.title }}</small></span>
        </button>
      {% endfor %}
      <button type="button" id="voice-toggle" aria-pressed="true" title="Read advisor replies aloud">Voice: On</button>
    </div>

    <div id="transcript"></div>

    <form id="chat-form">
      <input type="text" id="message-input" placeholder="Speak to the court..." autocomplete="off" />
      <button type="submit" id="send-button">Send</button>
      <button type="button" id="debate-button" disabled title="Activate at least two advisors">Let them debate</button>
    </form>
  </main>

  <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
