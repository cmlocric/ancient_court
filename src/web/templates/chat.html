<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ancient Court — Chat</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <h1>Ancient Court</h1>

  <div id="personas">
    <strong>Advisors:</strong>
    {% for persona in personas %}
      <label>
        <input type="checkbox" class="persona-checkbox" value="{{ persona.persona_id }}" />
        {{ persona.display_name }} — {{ persona.title }}
      </label>
    {% endfor %}
  </div>

  <div id="transcript"></div>

  <form id="chat-form">
    <input type="text" id="message-input" placeholder="Speak to the court..." autocomplete="off" />
    <button type="submit">Send</button>
  </form>

  <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
